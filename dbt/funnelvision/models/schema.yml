# ---------- SOURCES ----------

version: 2

sources:
  - name: raw
    database: FUNNELVISION_DB
    schema: RAW
    tables:
      - name: website_sessions
      - name: website_pageviews
      - name: orders
      - name: order_items
      - name: order_item_refunds
      - name: products
      - name: maven_fuzzy_factory_data_dictionary

models:
  # =========================
  # STAGING
  # =========================

  - name: stg_website_sessions
    description: Cleaned website session records.
    columns:
      - name: website_session_id
        data_tests: [unique, not_null]

  - name: stg_website_pageviews
    description: Cleaned website pageview records.
    columns:
      - name: website_pageview_id
        data_tests: [unique, not_null]
      - name: website_session_id
        data_tests: [not_null]

  - name: stg_orders
    description: Cleaned order-level records.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: website_session_id
        data_tests: [not_null]

  - name: stg_order_items
    description: Cleaned order item records.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [not_null]

  - name: stg_order_item_refunds
    description: Individual refund records.
    columns:
      - name: order_item_refund_id
        data_tests: [unique, not_null]
      - name: order_item_id
        data_tests: [not_null]
      - name: order_id
        data_tests: [not_null]

  - name: stg_products
    description: Cleaned product records.
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  # =========================
  # INTERMEDIATE
  # =========================

  - name: int_session_to_order
    description: Session-level conversion and order metrics.
    columns:
      - name: website_session_id
        data_tests: [unique, not_null]

  - name: int_order_items_with_refunds
    description: Order items enriched with aggregated refund amounts.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]

  # =========================
  # MARTS
  # =========================

  - name: fct_sessions
    description: Session-level fact table for conversion analysis.
    columns:
      - name: website_session_id
        data_tests: [unique, not_null]

  - name: fct_orders
    description: Order-level fact table for revenue and profit analysis.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: website_session_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_sessions')
                field: website_session_id

  - name: fct_refunds
    description: Individual refund records enriched with product information.
    columns:
      - name: order_item_refund_id
        data_tests: [unique, not_null]
      - name: order_item_id
        data_tests: [not_null]
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id

  - name: dim_product
    description: Product dimension.
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: dim_channel
    description: Distinct marketing source, campaign, content, device and referrer combinations.
    columns:
      - name: channel_key
        data_tests: [unique, not_null]

  - name: dim_date
    description: Calendar dimension derived from dates present in source data.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
